<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>核查结果</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
  .ok { color: #176f2c; font-weight: 600; }
  .bad { color: #b3261e; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
  th { background: #f0f0f0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  a.button, button { display: inline-block; padding: .5rem 1.2rem; font-size: 1rem;
         background: #176f2c; color: #fff; border-radius: 6px; text-decoration: none; }
</style>
</head>
<body>
<h1>核查结果</h1>

{% include "_report.html" %}

<div class="card">
  {% if token %}
    <a class="button" href="/download/{{ token }}">下载署名 CSV</a>
    <p>仅列出实际露出的原片编号与署名。</p>
  {% else %}
    <p class="bad">存在缺许可的露出，无法下载署名 CSV。请先解决上方列出的缺口。</p>
  {% endif %}
  <p><a href="/">← 重新上传</a></p>
</div>
</body>
</html>
